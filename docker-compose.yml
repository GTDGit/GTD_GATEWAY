networks:
  api_gtd-network:
    external: true
  gtd-gateway-network:
    driver: bridge
services:
  gateway:
    build: .
    container_name: gtd-gateway
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
    - PORT=8081
    - ENV=${ENV}
    - BASE_URL=${BASE_URL}
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - DB_NAME=${DB_NAME}
    - DB_SSLMODE=${DB_SSLMODE}
    - DB_SSLROOTCERT=${DB_SSLROOTCERT}
    - REDIS_HOST=${REDIS_HOST}
    - REDIS_PORT=${REDIS_PORT}
    - REDIS_PASSWORD=${REDIS_PASSWORD}
    - REDIS_DB=${REDIS_DB}
    - JWT_SECRET=${JWT_SECRET}
    - API_INTERNAL_URL=${API_INTERNAL_URL:-http://gtd-api:8080}
    - FILES_BASE_URL=${FILES_BASE_URL}
    - FILES_S3_REGION=${FILES_S3_REGION}
    - FILES_S3_BUCKET=${FILES_S3_BUCKET}
    - FILES_S3_ENDPOINT=${FILES_S3_ENDPOINT}
    - FILES_S3_ACCESS_KEY=${FILES_S3_ACCESS_KEY}
    - FILES_S3_SECRET_KEY=${FILES_S3_SECRET_KEY}
    - FILES_S3_KEY_PREFIX=${FILES_S3_KEY_PREFIX}
    - DIGIFLAZZ_USERNAME=${DIGIFLAZZ_USERNAME}
    - DIGIFLAZZ_KEY_PRODUCTION=${DIGIFLAZZ_KEY_PRODUCTION}
    - DIGIFLAZZ_KEY_DEVELOPMENT=${DIGIFLAZZ_KEY_DEVELOPMENT}
    - DIGIFLAZZ_WEBHOOK_SECRET=${DIGIFLAZZ_WEBHOOK_SECRET}
    - KIOSBANK_BASE_URL=${KIOSBANK_BASE_URL}
    - KIOSBANK_MERCHANT_ID=${KIOSBANK_MERCHANT_ID}
    - KIOSBANK_COUNTER_ID=${KIOSBANK_COUNTER_ID}
    - KIOSBANK_ACCOUNT_ID=${KIOSBANK_ACCOUNT_ID}
    - KIOSBANK_MITRA=${KIOSBANK_MITRA}
    - KIOSBANK_USERNAME=${KIOSBANK_USERNAME}
    - KIOSBANK_PASSWORD=${KIOSBANK_PASSWORD}
    - ALTERRA_BASE_URL=${ALTERRA_BASE_URL}
    - ALTERRA_CLIENT_ID=${ALTERRA_CLIENT_ID}
    - ALTERRA_PRIVATE_KEY_PATH=${ALTERRA_PRIVATE_KEY_PATH}
    - ALTERRA_PRIVATE_KEY_PEM=${ALTERRA_PRIVATE_KEY_PEM}
    - ALTERRA_CALLBACK_PUBLIC_KEY=${ALTERRA_CALLBACK_PUBLIC_KEY}
    - PAKAILINK_ENV=${PAKAILINK_ENV}
    - PAKAILINK_CLIENT_ID=${PAKAILINK_CLIENT_ID}
    - PAKAILINK_CLIENT_SECRET=${PAKAILINK_CLIENT_SECRET}
    - PAKAILINK_PARTNER_ID=${PAKAILINK_PARTNER_ID}
    - PAKAILINK_PRIVATE_KEY_PATH=${PAKAILINK_PRIVATE_KEY_PATH}
    - PAKAILINK_CALLBACK_URL=${PAKAILINK_CALLBACK_URL}
    - BRI_ENV=${BRI_ENV}
    - BRI_BASE_URL=${BRI_BASE_URL}
    - BRI_CLIENT_ID=${BRI_CLIENT_ID}
    - BRI_CLIENT_SECRET=${BRI_CLIENT_SECRET}
    - BRI_PARTNER_ID=${BRI_PARTNER_ID}
    - BRI_CHANNEL_ID=${BRI_CHANNEL_ID}
    - BRI_BRIVA_NUMBER=${BRI_BRIVA_NUMBER}
    - BRI_COMPANY_CODE=${BRI_COMPANY_CODE}
    - BRI_SOURCE_ACCOUNT=${BRI_SOURCE_ACCOUNT}
    - BRI_PRIVATE_KEY_PATH=${BRI_PRIVATE_KEY_PATH}
    - BRI_VA_CALLBACK_URL=${BRI_VA_CALLBACK_URL}
    - BRI_DISB_CALLBACK_URL=${BRI_DISB_CALLBACK_URL}
    - BRI_CONNECTOR_CLIENT_KEY=${BRI_CONNECTOR_CLIENT_KEY}
    - BRI_CONNECTOR_PUBLIC_KEY_PATH=${BRI_CONNECTOR_PUBLIC_KEY_PATH}
    - BRI_CONNECTOR_PUBLIC_KEY_PEM=${BRI_CONNECTOR_PUBLIC_KEY_PEM}
    - BRI_BRIZZI_USERNAME=${BRI_BRIZZI_USERNAME}
    - BRI_BRIZZI_DENOMINATIONS=${BRI_BRIZZI_DENOMINATIONS}
    - BNC_ENV=${BNC_ENV}
    - BNC_CLIENT_ID=${BNC_CLIENT_ID}
    - BNC_CLIENT_SECRET=${BNC_CLIENT_SECRET}
    - BNC_PARTNER_ID=${BNC_PARTNER_ID}
    - BNC_CHANNEL_ID=${BNC_CHANNEL_ID}
    - BNC_SOURCE_ACCOUNT=${BNC_SOURCE_ACCOUNT}
    - BNC_PRIVATE_KEY_PATH=${BNC_PRIVATE_KEY_PATH}
    - BNC_CONNECTOR_CLIENT_KEY=${BNC_CONNECTOR_CLIENT_KEY}
    - BNC_CONNECTOR_PUBLIC_KEY_PATH=${BNC_CONNECTOR_PUBLIC_KEY_PATH}
    - BNC_CONNECTOR_PUBLIC_KEY_PEM=${BNC_CONNECTOR_PUBLIC_KEY_PEM}
    - BNC_VA_CALLBACK_URL=${BNC_VA_CALLBACK_URL}
    - BNC_DISB_CALLBACK_URL=${BNC_DISB_CALLBACK_URL}
    - DANA_ENV=${DANA_ENV}
    - DANA_MERCHANT_ID=${DANA_MERCHANT_ID}
    - DANA_CLIENT_ID=${DANA_CLIENT_ID}
    - DANA_CLIENT_SECRET=${DANA_CLIENT_SECRET}
    - DANA_PARTNER_ID=${DANA_PARTNER_ID}
    - DANA_PRIVATE_KEY_PATH=${DANA_PRIVATE_KEY_PATH}
    - DANA_CALLBACK_URL=${DANA_CALLBACK_URL}
    - MIDTRANS_ENV=${MIDTRANS_ENV}
    - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
    - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
    - MIDTRANS_MERCHANT_ID=${MIDTRANS_MERCHANT_ID}
    - MIDTRANS_CALLBACK_URL=${MIDTRANS_CALLBACK_URL}
    - XENDIT_API_KEY=${XENDIT_API_KEY}
    - XENDIT_CALLBACK_TOKEN=${XENDIT_CALLBACK_TOKEN}
    - XENDIT_CALLBACK_URL=${XENDIT_CALLBACK_URL}
    networks:
    - gtd-gateway-network
    - api_gtd-network
    ports:
    - 8081:8081
    restart: unless-stopped
    volumes:
    - ./certs:/app/certs:ro
    - ./keys:/app/keys:ro
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD}
    container_name: gtd-gateway-redis
    healthcheck:
      interval: 5s
      retries: 5
      test:
      - CMD
      - redis-cli
      - -a
      - ${REDIS_PASSWORD}
      - ping
      timeout: 3s
    image: redis:7-alpine
    networks:
    - gtd-gateway-network
    restart: unless-stopped
