# =============================================================================
# Gateway (Go admin backend) — PRODUCTION reverse proxy
# Domain: gateway.gtd.co.id   (authored now, activated later)
#
# On the VPS the Gateway is deployed from /root/gateway, mirroring the existing
# /root/api and /root/admin layout. The Gateway is a Go HTTP backend listening
# on 127.0.0.1:8081 (ports 3001 and 8080 are already used by the Admin_App and
# the API on this shared VPS).
#
# It serves the admin surface only — the JWT-protected /v1/admin/* route group
# (including POST /v1/admin/auth/login and the GET /v1/admin/sse event stream)
# plus GET /v1/health. The Next.js Admin_App proxies its same-origin /api
# requests here so admin calls reach the Gateway backend.
# =============================================================================

# HTTP redirect to HTTPS
server {
    listen 80;
    server_name gateway.gtd.co.id;
    return 301 https://$host$request_uri;
}

# HTTPS Gateway Server
server {
    listen 443 ssl http2;
    server_name gateway.gtd.co.id;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/gateway.gtd.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.gtd.co.id/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

    location / {
        # Proxy all requests to the Gateway Go backend on 127.0.0.1:8081
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # Connection/upgrade headers — required so the GET /v1/admin/sse
        # Server-Sent Events stream stays open and is not buffered/closed.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;

        # Standard forwarded headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        # Long read timeout keeps the SSE connection alive between events.
        proxy_read_timeout 3600s;
    }
}
